name: rodinia_flutter
description: "Fast, synchronous, encrypted key-value storage for Flutter, backed by a Rust core with TTL expiration and reactive pub/sub events."
version: 0.0.1
homepage:

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^2.4.4
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  build_runner: ^2.4.13
  ffi: ^2.1.3
  ffigen: ^13.0.0
  freezed: ^2.5.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter


flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

