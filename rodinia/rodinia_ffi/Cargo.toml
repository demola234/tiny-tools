[package]
name = "rodinia_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
[dependencies.thiserror]
version = "2"
[dependencies.serde]
version = "1"
features = ["derive"]
[dependencies.bincode]
version = "1.3"
[dependencies.parking_lot]
version = "0.12"
[dependencies.aes-gcm]
version = "0.10"
[dependencies.zeroize]
version = "1"
[dependencies.rand]
version = "0.8"

[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "store"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
codegen-units = 1