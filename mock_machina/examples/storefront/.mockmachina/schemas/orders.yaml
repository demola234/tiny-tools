NewOrder:
  type: object
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [sku, qty]
        properties:
          sku: { type: string }
          qty: { type: integer, minimum: 1 }
Order:
  type: object
  required: [id, status, total, placedAt]
  properties:
    id: { type: string, pattern: "^o_", example: o_1001 }
    status: { type: string, enum: [placed, shipped, delivered, cancelled] }
    total: { type: number, minimum: 0, example: 4500 }
    placedAt: { type: string, format: date-time }
OrderList:
  type: object
  required: [orders]
  properties:
    orders: { type: array, items: { $ref: Order } }
Tracking:
  type: object
  required: [order, stage]
  properties:
    order: { type: string }
    stage: { type: string, enum: [packed, in_transit, out_for_delivery, delivered] }
    eta: { type: string }
