Credentials:
  type: object
  required: [email, password]
  properties:
    email: { type: string, format: email }
    password: { type: string, minLength: 1 }
Session:
  type: object
  required: [token]
  properties:
    token: { type: string }
Me:
  type: object
  required: [email]
  properties:
    email: { type: string }
    name: { type: string }
    phone: { type: string }
    city: { type: string }
