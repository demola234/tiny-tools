openapi: 3.1.0
info:
  title: Awkward shop
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: X-Request-Id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
              examples:
                some orders:
                  value: { orders: [{ id: o_1, total: 12.5, note: null, lines: [] }], next: 2 }
                no-orders:
                  value: { orders: [], next: null }
        default:
          $ref: "#/components/responses/Problem"
    post:
      description: |
        Create an order.
        The cart is emptied.
      requestBody:
        $ref: "#/components/requestBodies/NewOrder"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "422":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              example: { error: cart is empty }
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: "^o_" }
    get:
      operationId: getOrder
      responses:
        "200":
          description: One order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelOrder
      parameters:
        - name: session
          in: cookie
          schema: { type: string }
      responses:
        "204":
          description: Cancelled
  /categories/{id}/tree:
    get:
      operationId: categoryTree
      responses:
        "200":
          description: A category and its children
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
  requestBodies:
    NewOrder:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lines]
            properties:
              lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Line" } }
  responses:
    Problem:
      description: A problem
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Order:
      type: object
      required: [id, total, lines]
      properties:
        id: { type: string, pattern: "^o_" }
        total: { type: number, minimum: 0 }
        note: { type: [string, "null"] }
        lines: { type: array, items: { $ref: "#/components/schemas/Line" } }
        payment:
          oneOf:
            - { $ref: "#/components/schemas/Card" }
            - { type: object, required: [iban], properties: { iban: { type: string } } }
    OrderList:
      allOf:
        - type: object
          required: [orders]
          properties:
            orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        - type: object
          required: [next]
          properties:
            next: { type: [integer, "null"] }
    Line:
      type: object
      required: [sku, qty]
      properties:
        sku: { type: string }
        qty: { type: integer, minimum: 1 }
    Card:
      type: object
      required: [last4]
      properties:
        last4: { type: string, pattern: "^[0-9]{4}$", example: "4242" }
    Category:
      type: object
      required: [name, children]
      properties:
        name: { type: string }
        children: { type: array, items: { $ref: "#/components/schemas/Category" } }
    Problem:
      type: object
      required: [error]
      properties:
        error: { type: string }
