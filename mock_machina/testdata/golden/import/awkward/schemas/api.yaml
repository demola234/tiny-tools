Card:
  type: object
  required: [last4]
  properties: {last4: {type: string, pattern: '^[0-9]{4}$', example: "4242"}}
Category:
  type: object
  required: [name, children]
  properties: {name: {type: string}, children: {type: array, items: {$ref: Category}}}
Line:
  type: object
  required: [sku, qty]
  properties: {sku: {type: string}, qty: {type: integer, minimum: 1}}
Order:
  type: object
  required: [id, total, lines]
  properties:
    id: {type: string, pattern: ^o_}
    total: {type: number, minimum: 0}
    note: {type: [string, "null"]}
    lines: {type: array, items: {$ref: Line}}
    payment:
      oneOf:
        - {$ref: Card}
        - {type: object, required: [iban], properties: {iban: {type: string}}}
OrderList:
  allOf:
    - type: object
      required: [orders]
      properties: {orders: {type: array, items: {$ref: Order}}}
    - {type: object, required: [next], properties: {next: {type: [integer, "null"]}}}
Problem: {type: object, required: [error], properties: {error: {type: string}}}
