name: mock_machina

on:
  push:
    branches: [main, "mockmachina/**"]
    paths: ["mock_machina/**", ".github/workflows/mock_machina.yml"]
  pull_request:
    paths: ["mock_machina/**", ".github/workflows/mock_machina.yml"]

permissions:
  contents: read

concurrency:
  group: mock_machina-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mock_machina

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Tools (govulncheck v1.8.0 needs Go 1.26) run on stable Go. Analysis still
      # targets the go.mod version: vet's stdversion check and golangci's run.go.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: mock_machina/go.sum
      - run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: mock_machina
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/mock_machina.yml
        working-directory: .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [go.mod, stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'mock_machina/go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          cache-dependency-path: mock_machina/go.sum
      - run: go test -race -shuffle=on -count=1 -cover ./...
      - run: go build -o bin/ ./cmd/mockmachina
      # Task 3 replaces --help with --version (Phase 0 exit criterion 1).
      - run: ./bin/mockmachina --help
        shell: bash
