name: mock_machina release

on:
  push:
    tags: ["mock_machina/v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: mock_machina-release-${{ github.ref }}

defaults:
  run:
    working-directory: mock_machina

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mock_machina/go.mod
          cache-dependency-path: mock_machina/go.sum
      - id: version
        run: echo "version=${GITHUB_REF_NAME#mock_machina/}" >> "$GITHUB_OUTPUT"
      - run: go test ./...
      - run: go run ./tools/release build --version "${{ steps.version.outputs.version }}" --out dist
      - run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 app -json -main cmd/mockmachina -output dist/sbom.cdx.json .
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.zip dist/checksums.txt dist/sbom.cdx.json install.sh
          --title "MockMachina ${{ steps.version.outputs.version }}"
          --notes-file dist/notes.md
      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/demola234/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/mockmachina.rb tap/Formula/mockmachina.rb
          cd tap
          git add Formula/mockmachina.rb
          git -c user.name="mockmachina release" -c user.email="actions@users.noreply.github.com" commit -m "mockmachina ${{ steps.version.outputs.version }}"
          git push
      - name: Update the Scoop bucket
        if: env.SCOOP_BUCKET_TOKEN != ''
        run: |
          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/demola234/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp dist/mockmachina.json bucket/bucket/mockmachina.json
          cd bucket
          git add bucket/mockmachina.json
          git -c user.name="mockmachina release" -c user.email="actions@users.noreply.github.com" commit -m "mockmachina ${{ steps.version.outputs.version }}"
          git push

  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mock_machina
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release.outputs.version }}
          push: true
          tags: |
            ghcr.io/demola234/mockmachina:${{ needs.release.outputs.version }}
            ghcr.io/demola234/mockmachina:latest
