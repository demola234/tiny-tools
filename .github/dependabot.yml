version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /mock_machina
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: charm.land/bubbletea/v2
        versions: [">= 2.0.10"]
      - dependency-name: golang.org/x/text
        versions: [">= 0.42.0"]
      - dependency-name: golang.org/x/sync
        versions: [">= 0.23.0"]
